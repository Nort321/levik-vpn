server {
    listen 2.27.201.130:8443 ssl;
    server_name 2.27.201.130;

    ssl_certificate /etc/levik-relay/tls/server.crt;
    ssl_certificate_key /etc/levik-relay/tls/server.key;
    ssl_client_certificate /etc/levik-relay/tls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 16k;
    client_body_timeout 5s;
    keepalive_timeout 15s;
    server_tokens off;

    access_log /var/log/nginx/levik-relay-access.log combined;
    error_log /var/log/nginx/levik-relay-error.log warn;

    location ^~ /internal/v1/leases/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9088;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        proxy_request_buffering on;
        proxy_buffering on;
    }

    location = /livez {
        proxy_pass http://127.0.0.1:9088;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:9088;
    }

    location / {
        return 404;
    }
}
