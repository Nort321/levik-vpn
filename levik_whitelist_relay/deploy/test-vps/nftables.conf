#!/usr/sbin/nft -f

# Replace only Levik-owned tables. `destroy` is idempotent when the table does
# not exist and preserves provider, Docker, or operator-managed firewall state.
destroy table inet levik_filter
destroy table ip levik_nat

table inet levik_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        tcp dport 22 accept
        udp dport 56000 accept
        ip saddr 94.156.114.70 tcp dport 8443 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "wdtt0" oifname "ens3" ip saddr 10.66.66.0/24 ct state new,established,related accept comment "levik-wlr-forward-out"
        iifname "ens3" oifname "wdtt0" ip daddr 10.66.66.0/24 ct state established,related accept comment "levik-wlr-forward-return"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip levik_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "ens3" ip saddr 10.66.66.0/24 masquerade comment "levik-wlr-masquerade"
    }
}
