services:
  levik-vpn-bot:
    build: .
    image: levik-vpn-bot:${LEVIK_BRIDGE_RELEASE_TAG:?Set LEVIK_BRIDGE_RELEASE_TAG to an immutable release ID}
    container_name: levik-vpn-bot
    restart: unless-stopped
    environment:
      BOT_CONFIG_PATH: /app/config.json
      BOT_BANNER_PATH: /app/assets/levik-banner.png
      BOT_DATA_DIR: /app/data
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot.env
      REMNAWAVE_BASE_URL: https://remnawave-caddy:3443
      REMNAWAVE_API_ENV_FILE: /run/secrets/remnawave-api.env
      REMNAWAVE_TLS_VERIFY: "false"
      CABINET_BRIDGE_ENV_FILE: /run/secrets/cabinet-bridge.env
      CABINET_BRIDGE_KEY_ID: cabinet-v1-20260729
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data
      - ./.env:/run/secrets/telegram-bot.env:ro
      - /root/.remnawave-api.env:/run/secrets/remnawave-api.env:ro
      - ./secrets/cabinet-bridge.env:/run/secrets/cabinet-bridge.env:ro
    networks:
      - remnawave-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  remnawave-network:
    name: remnawave-network
    external: true
