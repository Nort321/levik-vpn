name: Сообщение об ошибке (Bug Report)
description: Сообщите о воспроизводимой проблеме в приложении.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Пожалуйста, не сообщайте об уязвимостях и не прикладывайте учетные данные, сессии, личные данные или полные логи здесь. Ознакомьтесь с [SECURITY.md](SECURITY.md) для отчетов о безопасности.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - Android-приложение (Levik VPN)
        - VPN-сервис и туннелирование
        - Авторизация и аккаунты
        - Интерфейс и UI (Jetpack Compose)
        - OTA-обновления (Direct сборка)
        - Инструменты сборки и документация
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения или хэш коммита
      description: Укажите версию релиза или коммит.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Укажите модель устройства, версию Android и архитектуру (например, Pixel 8, Android 14, arm64-v8a).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Опишите минимальную последовательность действий для воспроизведения проблемы.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Скриншоты и логи
      description: Приложите безопасные скриншоты или фрагменты логов без личных данных.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждение
      options:
        - label: Я удалил секреты, токены, личные данные и приватные адреса.
          required: true
        - label: Это сообщение не является отчетом об уязвимости безопасности.
          required: true
