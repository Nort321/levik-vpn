name: Предложение функции (Feature Request)
description: Предложите улучшение или новую возможность для приложения.
title: "feat: "
body:
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - Android-приложение (Levik VPN)
        - VPN-протоколы и маршрутизация
        - Авторизация и безопасность
        - Пользовательский интерфейс (UI/UX)
        - Инструменты сборки и CI/CD
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Проблема или потребность
      description: Опишите пользовательскую задачу или проблему, которую необходимо решить.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Ожидаемый результат
      description: Каким должен быть результат реализации фичи.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Ограничения и риски
      description: Укажите требования к совместимости, безопасности или производительности.
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Предложение не содержит секретов, личных данных или приватных адресов.
          required: true
