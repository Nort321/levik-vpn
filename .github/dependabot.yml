version: 2
updates:
  - package-ecosystem: gradle
    directory: /levik_vpn_android
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    # This repository is published for source transparency and does not accept
    # pull requests. Vulnerability alerts remain enabled in GitHub Security.
    open-pull-requests-limit: 0
    rebase-strategy: auto
    commit-message:
      prefix: chore(android-deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    rebase-strategy: auto
    commit-message:
      prefix: chore(ci-deps)
