name: Web CI

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: levik_vpn_landing/package-lock.json

      - name: Install dependencies
        working-directory: levik_vpn_landing
        run: npm ci

      - name: Run linter
        working-directory: levik_vpn_landing
        run: npm run lint

      - name: Run type check
        working-directory: levik_vpn_landing
        run: npm run typecheck

      - name: Run unit tests
        working-directory: levik_vpn_landing
        run: npm test

      - name: Run build
        working-directory: levik_vpn_landing
        run: npm run build
