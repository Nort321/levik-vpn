name: Repository Policy

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tracked repository content
        run: ./scripts/ci/check-repository-policy.sh

      - name: Validate immutable action references
        run: ./scripts/ci/check-action-pins.sh

      - name: Validate fail-closed Android release workflow
        run: ./scripts/ci/check-android-release-workflow.sh
