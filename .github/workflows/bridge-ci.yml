name: Bridge CI

"on":
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: levik_vpn_bridge/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r levik_vpn_bridge/requirements.txt pytest

      - name: Run unit tests
        run: PYTHONPATH=levik_vpn_bridge pytest levik_vpn_bridge/tests
