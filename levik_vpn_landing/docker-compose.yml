name: leviknet

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./secrets/db-owner.env
      - ./secrets/app-db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  migrate:
    image: leviknet-migrate:${LEVIK_RELEASE_TAG:?Set LEVIK_RELEASE_TAG to an immutable release ID}
    build:
      context: .
      target: migrator
    logging: *default-logging
    env_file:
      - ./secrets/db-owner.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_DATABASE_ROLE: levik_app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25
    networks:
      - backend

  geoip:
    image: leviknet-geoip:${LEVIK_RELEASE_TAG:?Set LEVIK_RELEASE_TAG to an immutable release ID}
    build:
      context: .
      target: geoip-updater
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - geoip-data:/var/lib/leviknet/geoip
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "scripts/geoip-updater.mjs",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 25
    mem_limit: 256m
    cpus: 0.25
    networks:
      - edge

  app:
    image: leviknet-app:${LEVIK_RELEASE_TAG:?Set LEVIK_RELEASE_TAG to an immutable release ID}
    build:
      context: .
      target: runner
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./secrets/app.env
      - ./secrets/app-db.env
      - ./secrets/maintenance.env
      - ./secrets/remnawave-api.env
      - ./secrets/status.env
      - ./secrets/monitor-app.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      geoip:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - geoip-data:/var/lib/leviknet/geoip:ro
      - downloads-data:/var/lib/leviknet/downloads:rw
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/.next/cache:size=32m,mode=0755,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    mem_limit: 768m
    cpus: 0.75
    networks:
      - edge
      - backend

  maintenance:
    image: leviknet-maintenance:${LEVIK_RELEASE_TAG:?Set LEVIK_RELEASE_TAG to an immutable release ID}
    build:
      context: .
      target: maintenance-worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./secrets/maintenance.env
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 25
    mem_limit: 64m
    cpus: 0.1
    networks:
      - backend

  monitor-probe:
    image: leviknet-monitor-probe:${LEVIK_RELEASE_TAG:?Set LEVIK_RELEASE_TAG to an immutable release ID}
    build:
      context: .
      target: monitor-probe
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./secrets/monitor-probe.env
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 40
    mem_limit: 96m
    cpus: 0.2
    networks:
      - edge

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - downloads-data:/var/lib/leviknet/downloads:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.25

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  geoip-data:
  downloads-data:

networks:
  edge:
  backend:
    internal: true
